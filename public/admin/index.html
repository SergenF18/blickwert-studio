<!doctype html>

<html lang="de">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <meta
    name="theme-color"
    content="#121717"
  >

  <title>Blickwert Studio · Admin</title>

  <link
    rel="icon"
    href="/assets/favicon.svg"
  >


  <style>

    /* =====================================================
       NUR BLICKWERT-EIGENE ELEMENTE
       Decap selbst wird NICHT überschrieben
    ===================================================== */

    :root {
      --bw-bg: #121717;
      --bw-bg-soft: #18201f;

      --bw-text: #f2f1e9;
      --bw-muted: #9ca7a4;

      --bw-accent: #28d0c7;

      --bw-border:
        rgba(255, 255, 255, 0.12);

      --bw-shadow:
        0 18px 60px rgba(0, 0, 0, 0.32);
    }


    * {
      box-sizing: border-box;
    }


    /* =====================================================
       LADEBILDSCHIRM
    ===================================================== */

    #blickwert-loader {
      position: fixed;

      inset: 0;

      z-index: 9999999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: var(--bw-bg);

      color: var(--bw-text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }


    .loader-card {
      width: min(620px, 100%);

      padding: 42px;

      border:
        1px solid var(--bw-border);

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.045),
          rgba(255,255,255,0.015)
        );

      box-shadow:
        var(--bw-shadow);
    }


    .loader-logo {
      display: block;

      width: 200px;
      max-width: 65%;

      margin-bottom: 38px;
    }


    .loader-label {
      display: inline-flex;

      margin-bottom: 20px;

      padding: 7px 11px;

      border:
        1px solid rgba(40, 208, 199, 0.25);

      border-radius: 999px;

      background:
        rgba(40, 208, 199, 0.08);

      color:
        var(--bw-accent);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.11em;

      text-transform: uppercase;
    }


    .loader-card h1 {
      margin:
        0 0 18px;

      font-size:
        clamp(42px, 7vw, 68px);

      font-weight: 600;

      line-height: 0.98;

      letter-spacing:
        -0.055em;
    }


    .loader-card h1 span {
      color:
        var(--bw-accent);
    }


    .loader-card p {
      margin:
        0;

      color:
        var(--bw-muted);

      font-size: 15px;

      line-height: 1.7;
    }


    #loader-status {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-top: 28px;

      color:
        var(--bw-text);

      font-weight: 600;
    }


    #loader-status::before {
      content: "";

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background:
        var(--bw-accent);

      box-shadow:
        0 0 0 6px
        rgba(40, 208, 199, 0.10);
    }


    /* =====================================================
       BLICKWERT ADMIN DOCK
    ===================================================== */

    #blickwert-dock {
      position: fixed;

      left: 50%;
      bottom: 20px;

      z-index: 9999998;

      display: flex;
      align-items: center;

      gap: 14px;

      max-width:
        calc(100vw - 28px);

      padding:
        9px 10px 9px 16px;

      border:
        1px solid var(--bw-border);

      border-radius: 999px;

      background:
        rgba(18, 23, 23, 0.92);

      color:
        var(--bw-text);

      box-shadow:
        var(--bw-shadow);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      transform:
        translateX(-50%);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }


    .dock-brand {
      display: flex;
      align-items: center;

      gap: 11px;

      min-width: 0;
    }


    .dock-brand img {
      display: block;

      width: 110px;
      height: auto;
    }


    .dock-divider {
      width: 1px;
      height: 26px;

      flex: 0 0 auto;

      background:
        var(--bw-border);
    }


    .dock-title {
      display: flex;
      flex-direction: column;

      min-width: 0;

      line-height: 1.05;
    }


    .dock-title strong {
      font-size: 12px;

      white-space: nowrap;

      letter-spacing: 0.03em;
    }


    .dock-title span {
      margin-top: 4px;

      color:
        var(--bw-muted);

      font-size: 10px;

      white-space: nowrap;
    }


    .dock-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      min-height: 40px;

      padding:
        0 16px;

      border:
        1px solid rgba(40, 208, 199, 0.32);

      border-radius:
        999px;

      background:
        rgba(40, 208, 199, 0.08);

      color:
        var(--bw-accent);

      font-size: 12px;
      font-weight: 700;

      white-space: nowrap;

      text-decoration: none;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }


    .dock-link:hover {
      background:
        var(--bw-accent);

      color:
        #071010;

      transform:
        translateY(-1px);
    }


    .dock-link:focus-visible {
      outline:
        2px solid var(--bw-accent);

      outline-offset:
        3px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 650px) {

      #blickwert-dock {
        bottom: 12px;

        width:
          calc(100vw - 24px);

        justify-content:
          space-between;

        padding:
          8px 8px 8px 13px;
      }


      .dock-divider,
      .dock-title span {
        display: none;
      }


      .dock-brand {
        gap: 8px;
      }


      .dock-brand img {
        width: 92px;
      }


      .dock-title strong {
        font-size: 11px;
      }


      .dock-link {
        padding:
          0 13px;
      }


      .loader-card {
        padding:
          30px 24px;
      }

    }

  </style>

</head>


<body>


<!-- =======================================================
     BLICKWERT LADEBILDSCHIRM
======================================================== -->

<div id="blickwert-loader">

  <div class="loader-card">

    <img
      class="loader-logo"
      src="/assets/logo.svg"
      alt="Blickwert Studio"
    >


    <div class="loader-label">
      Studio Admin
    </div>


    <h1>
      Dein Studio.<br>
      <span>Deine Inhalte.</span>
    </h1>


    <p>
      Projekte, Leistungen, Bilder und Website-Inhalte
      zentral verwalten.
    </p>


    <div id="loader-status">
      CMS wird geladen …
    </div>

  </div>

</div>


<!-- =======================================================
     BLICKWERT DOCK
======================================================== -->

<div id="blickwert-dock">

  <div class="dock-brand">

    <img
      src="/assets/logo.svg"
      alt="Blickwert Studio"
    >


    <span
      class="dock-divider"
      aria-hidden="true"
    ></span>


    <div class="dock-title">

      <strong>
        Studio Admin
      </strong>

      <span>
        Inhalte & Portfolio
      </span>

    </div>

  </div>


  <a
    class="dock-link"
    href="/"
    target="_blank"
    rel="noopener noreferrer"
  >
    Website ansehen

    <span aria-hidden="true">
      ↗
    </span>
  </a>

</div>


<!-- =======================================================
     DECAP CMS
======================================================== -->

<script>

  window.CMS_MANUAL_INIT = true;


  fetch("/admin/config.json")

    .then((response) => {

      if (!response.ok) {
        throw new Error(
          "CMS-Konfiguration konnte nicht geladen werden."
        );
      }

      return response.json();

    })

    .then((config) => {

      const script =
        document.createElement(
          "script"
        );


      script.src =
        "https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js";


      script.onload = () => {

        CMS.init({
          config,
          load_config_file: false,
        });


        /*
         * Website-CSS nur für Decap Preview.
         * NICHT für die CMS-Oberfläche.
         */

        try {

          CMS.registerPreviewStyle(
            "/styles.css"
          );

        } catch (error) {

          console.info(
            "Preview-Style nicht geladen:",
            error
          );

        }


        /*
         * Ladebildschirm entfernen.
         */

        const loader =
          document.querySelector(
            "#blickwert-loader"
          );

        if (loader) {

          loader.style.opacity =
            "0";

          loader.style.transition =
            "opacity 0.25s ease";


          setTimeout(
            () => loader.remove(),
            250
          );

        }

      };


      script.onerror = () => {

        document.querySelector(
          "#loader-status"
        ).textContent =
          "CMS konnte nicht geladen werden.";

      };


      document.body.append(
        script
      );

    })

    .catch((error) => {

      console.error(error);

      document.querySelector(
        "#loader-status"
      ).textContent =
        "CMS-Konfiguration nicht erreichbar.";

    });

</script>


</body>

</html>
